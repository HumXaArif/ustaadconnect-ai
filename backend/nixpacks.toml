# Nixpacks deployment configuration for Puppeteer/whatsapp-web.js on Railway

[phases.setup]
aptPkgs = [
  "chromium",
  "libatk-1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "libnss3",
  "libnspr4"
]

[phases.build]
cmds = ["npm ci"]
